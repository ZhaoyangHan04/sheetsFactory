<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">sheetsFactory：从工作簿到可验收任务</title>
<desc id="desc">十二个独立节点按编号折行：第一行向右，第二行向左，第三行向右。规范化、画像、规划、构造、题面、原生验算、独立审查、代理尝试、逐项诊断、Harbor导出、真实控制、冻结确认准出。成功和失败均诊断。R01至R10修复后返回规划或构造，R12返回相应证据阶段，R11仅重试故障阶段。正式难度另行冻结确认。</desc>
<defs>
<marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M3 2 L10 6.5 L3 11" fill="none" stroke="#8194aa" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="repairArrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M3 2 L10 6.5 L3 11" fill="none" stroke="#c47725" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
