.title {font-size:32px;font-weight:700;fill:#172e47;}
.body {font-size:26px;fill:#45586e;}
.number {font-size:23px;font-weight:700;text-anchor:middle;}
.next {fill:none;stroke:#8194aa;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow);}
.repair {fill:none;stroke:#c47725;stroke-width:2.6;stroke-dasharray:7 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#repairArrow);}
.routeTitle {font-size:25px;font-weight:700;fill:#965b1c;}
.routeBody {font-size:24px;fill:#805e37;}
</style>
